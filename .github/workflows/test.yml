name: test

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Luau
        run: |
          curl -fsSL -o luau.zip https://github.com/luau-lang/luau/releases/latest/download/luau-ubuntu.zip
          unzip -q luau.zip -d "$HOME/luau"
          chmod +x "$HOME/luau/"*
          echo "$HOME/luau" >> "$GITHUB_PATH"
      - name: Run tests
        run: bash tests/run.sh
